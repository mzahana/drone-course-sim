# ros_gz bridge for the course aircraft (x500_course_gimbal).
#
# Gazebo nests sensor topics under the world and appends an instance number to
# the model name, which makes for unusable topic names in a lab. Everything is
# renamed here to short, stable names that student code can hard-code.

# Simulation clock. Every node in the course must run with use_sim_time:=true,
# otherwise TF lookups by image timestamp silently return the wrong transform.
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/camera_info"
  gz_topic_name: "/world/course_world/model/x500_course_gimbal_0/link/camera_link/sensor/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# Measured gimbal joint angles. robot_state_publisher turns these into the
# base_link -> camera_optical_frame chain via the URDF. On the real aircraft the
# same three joint values come from the SIYI driver instead.
- ros_topic_name: "/joint_states"
  gz_topic_name: "/world/course_world/model/x500_course_gimbal_0/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# Gimbal joint commands, ROS -> Gazebo.
#
# PX4 also advertises these, but only writes them when a new setpoint arrives
# from its gimbal module -- it does not stream, so it does not fight us. On the
# real aircraft the A8 mini hangs off the onboard computer rather than the
# autopilot, so commanding the gimbal from ROS is the faithful arrangement, not
# a simulation shortcut.
#
# These are internal: student code talks to /gimbal/cmd/{angle,rate}, which
# gimbal_interface_node turns into these.
- ros_topic_name: "/gimbal/_gz/roll"
  gz_topic_name: "/model/x500_course_gimbal_0/command/gimbal_roll"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/gimbal/_gz/pitch"
  gz_topic_name: "/model/x500_course_gimbal_0/command/gimbal_pitch"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/gimbal/_gz/yaw"
  gz_topic_name: "/model/x500_course_gimbal_0/command/gimbal_yaw"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

# --- ground target -----------------------------------------------------------
# Route commands out. The target is driven in its own body frame.
- ros_topic_name: "/target/cmd_vel"
  gz_topic_name: "/model/course_target_vehicle/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# Ground truth for the scoring script and for checking a student's estimate.
# NEVER for flight: nothing a mission depends on may come from here, because
# nothing like it exists on the real aircraft.
- ros_topic_name: "/target/ground_truth"
  gz_topic_name: "/model/course_target_vehicle/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS
